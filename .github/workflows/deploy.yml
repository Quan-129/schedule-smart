name: Deploy Markdown Schedule to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Cấp quyền cho GITHUB_TOKEN để triển khai lên GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Giới hạn chỉ chạy 1 deployment cùng lúc
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5

      - name: Đóng gói Artifacts (Toàn bộ trang web & file .md)
        uses: actions/upload-pages-artifact@v3
        with:
          # Đẩy toàn bộ thư mục gốc chứa index.html, style.css, app.js và thư mục schedules/
          path: '.'

      - name: Triển khai lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
